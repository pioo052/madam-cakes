; MADAM CAKES — PHP settings for the container.
expose_php = Off

; The application accepts images up to 5 MB (MAX_UPLOAD_BYTES); leave headroom
; for the multipart envelope and a possible second field.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60
