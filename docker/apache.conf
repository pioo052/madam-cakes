# MADAM CAKES — Apache settings for the application document root.
# Debian's default /var/www/ directory has AllowOverride None, which would
# silently disable the security rules in the application's .htaccess files.

ServerName localhost
DirectoryIndex index.php index.html

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Uploads must never execute code; the rules live in assets/uploads/.htaccess.
<Directory /var/www/html/assets/uploads>
    Options -Indexes -ExecCGI
    AllowOverride All
</Directory>
